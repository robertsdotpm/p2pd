[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2pd"
version = "4.0.1"
description = "Asynchronous P2P networking library and service"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "public domain"}
authors = [
    {name = "Matthew Roberts", email = "matthew@roberts.pm"}
]
keywords = [
    "NAT traversal", "TCP hole punching", "simultaneous open",
    "UPnP", "STUN", "TURN", "P2P", "peer-to-peer", "networking",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]
dependencies = [
    "aionetiface>=0.0.15",
    "namebump>=0.0.8",
    "sidewire>=0.1.1",
    "ecdsa>=0.18",
]

[project.urls]
Homepage = "https://github.com/robertsdotpm/p2pd"
Repository = "https://github.com/robertsdotpm/p2pd"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
